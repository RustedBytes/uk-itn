[package]
name = "ukrainian-itn"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Ukrainian inverse text normalization runtime using rustfst"
repository = "https://github.com/lociko/ukraine_itn_wfst"
readme = "README.md"
keywords = ["itn", "ukrainian", "wfst", "text-normalization"]
categories = ["text-processing"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ukrainian_itn_cli"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
anyhow = "1.0.100"
pyo3 = { version = "0.29.2", optional = true, features = ["abi3-py39"] }
regex = "1.12.2"
rustfst = "1.3.1"

[dev-dependencies]
tempfile = "3.23.0"
