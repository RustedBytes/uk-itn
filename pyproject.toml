[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ukrainian_itn"
version = "0.4.1"
authors = [
    { name = "Vasyl Spachynskyi", email = "vspachyn@gmail.com" },
    { name = "Yehor Smoliakov", email = "egorsmkv@gmail.com" },
]
description = "Fast Ukrainian Inverse Text Normalization powered by Rust WFSTs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["itn", "inverse-text-normalization", "ukrainian", "wfst", "rust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Natural Language :: Ukrainian",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
grammar = ["pynini>=2.1.6"]

[project.scripts]
ukrainian-itn = "ukrainian_itn.__main__:main"

[project.urls]
"Homepage" = "https://github.com/RustedBytes/uk-itn"
"Bug Tracker" = "https://github.com/RustedBytes/uk-itn/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "ruff>=0.15.20",
]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
manifest-path = "crates/ukrainian-itn/Cargo.toml"
module-name = "ukrainian_itn._rust"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]
