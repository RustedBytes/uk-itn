name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package and test dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Test native Python runtime
        run: uv run --python "${{ matrix.python-version }}" pytest tests/test_api.py

  grammar:
    name: Python grammar tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install grammar development dependencies
        run: uv sync --locked --extra grammar --python "3.10"

      - name: Run complete Python test suite
        run: uv run --python "3.10" pytest

  quality:
    name: Rust and Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked

      - name: Check Python formatting and lint
        run: uv run ruff check .

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-features --locked

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build sdist and wheel
        run: uv build

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          wheel = next(Path("dist").glob("*.whl"))

          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              required_suffixes = (
                  "/Cargo.toml",
                  "/Cargo.lock",
                  "/grammars/ukrainian_itn_tagger.fst",
                  "/grammars/ukrainian_itn_verbalizer.fst",
                  "/src/lib.rs",
                  "/src/main.rs",
                  "/src/python.rs",
              )
              missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
              if missing:
                  raise SystemExit(f"sdist is missing Rust sources or grammars: {missing}")

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "ukrainian_itn/py.typed",
                  "ukrainian_itn/data/month.tsv",
                  "ukrainian_itn/data/measurements.tsv",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"wheel is missing package data: {missing}")
              if not any(name.startswith("ukrainian_itn/_rust") for name in names):
                  raise SystemExit("wheel is missing the PyO3 extension")
              if any(name.endswith(".fst") for name in names):
                  raise SystemExit("wheel contains loose FST files instead of embedding them")
          PY

      - name: Check package metadata
        run: uvx --from twine twine check dist/*

      - name: Install wheel in an isolated environment
        run: |
          uv venv /tmp/ukrainian-itn-wheel --python 3.14
          uv pip install --no-deps --python /tmp/ukrainian-itn-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/ukrainian-itn-wheel/bin/python - <<'PY'
          import importlib.util
          from ukrainian_itn import InverseNormalizer, normalize

          assert importlib.util.find_spec("pynini") is None
          assert normalize("сто гривень") == "₴100"
          assert normalize("сьома година двадцять п'ять хвилин", json=True) == '[{"time": "07:25"}]'
          assert InverseNormalizer().normalize("двадцять дві тисячі сто один") == "22101"
          PY

  parity:
    name: Python and Rust parity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --python "3.14"

      - name: Build Rust CLI
        run: cargo build --release --locked -p ukrainian-itn --bin ukrainian_itn_cli

      - name: Check embedded Python and Rust parity
        run: uv run --python "3.14" python .github/scripts/check_rust_parity.py target/release/ukrainian_itn_cli
