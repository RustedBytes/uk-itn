name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest -q
      - name: Lint
        if: matrix.python-version == '3.13'
        run: uv run ruff check .

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          sdist = next(Path("dist").glob("*.tar.gz"))
          wheel = next(Path("dist").glob("*.whl"))

          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              required_suffixes = (
                  "/Cargo.toml",
                  "/Cargo.lock",
                  "/crates/ukrainian-itn/Cargo.toml",
                  "/crates/ukrainian-itn/src/lib.rs",
                  "/crates/ukrainian-itn/src/main.rs",
                  "/crates/ukrainian-itn/src/python.rs",
              )
              missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
              if missing:
                  raise SystemExit(f"sdist is missing Rust sources: {missing}")

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "ukrainian_itn/py.typed",
                  "ukrainian_itn/data/month.tsv",
                  "ukrainian_itn/data/measurements.tsv",
                  "ukrainian_itn/grammars/ukrainian_itn_tagger.fst",
                  "ukrainian_itn/grammars/ukrainian_itn_verbalizer.fst",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"wheel is missing package data: {missing}")
              if not any(name.startswith("ukrainian_itn/_rust") for name in names):
                  raise SystemExit("wheel is missing the PyO3 extension")
          PY
      - name: Check package metadata
        run: uvx --from twine twine check dist/*
      - name: Install wheel in an isolated environment
        run: |
          uv venv /tmp/ukrainian-itn-wheel
          uv pip install --no-deps --python /tmp/ukrainian-itn-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/ukrainian-itn-wheel/bin/python - <<'PY'
          import importlib.util
          from ukrainian_itn import InverseNormalizer, normalize

          assert importlib.util.find_spec("pynini") is None
          assert normalize("сто гривень") == "₴100"
          assert normalize("сьома година двадцять п'ять хвилин", json=True) == '[{"time": "07:25"}]'
          assert InverseNormalizer().normalize("двадцять дві тисячі сто один") == "22101"
          PY

  rust:
    name: Rust build and Python parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.13
      - name: Export grammars
        run: uv run python -m ukrainian_itn.export grammars_export
      - name: Test and build Rust library and CLI
        run: |
          cargo test --workspace --locked
          cargo clippy -p ukrainian-itn --all-targets --locked -- -D warnings
          cargo build --release --locked -p ukrainian-itn --bin ukrainian_itn_cli
      - name: Check Python and Rust parity
        run: uv run python .github/scripts/check_rust_parity.py target/release/ukrainian_itn_cli grammars_export
