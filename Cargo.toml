[package]
name = "ukrainian-itn"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Rust runtime for Ukrainian inverse text normalization"
repository = "https://github.com/lociko/ukraine_itn_wfst"
exclude = ["dist/"]

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ukrainian_itn_cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
regex = "1.12.2"
rustfst = "1.3.1"

[dev-dependencies]
tempfile = "3.23.0"
